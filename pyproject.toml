[project]
name = "timeseriescourse"
version = "0.1.0"
description = "Time series forecasting ML project"
authors = [
    {name = "Vladimir Slutskiy",email = "wyziq@me.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = ["numpy (>=1.26,<3)", "pandas (>=2.2,<3)", "statsforecast (>=2,<3)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.17.2,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E402"]
